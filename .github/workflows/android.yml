name: Android CI and Release Builds

on:
  push:
    branches:
      - '**'
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'build.gradle*'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'build.gradle*'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this successful build as a GitHub prerelease'
        required: true
        type: boolean
        default: false

# Verification is read-only. Release publishing gets write access only in its own job.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # PR checks are the normal feature-branch validation path. Avoid duplicate push builds
    # for ordinary feature commits; use workflow_dispatch for an on-demand preview.
    # A [phone-test] feature push intentionally builds and publishes a preview.
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[phone-test]')
    name: Build, tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK and required packages
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Build, test, and lint
        run: ./gradlew --no-daemon --build-cache :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Prepare build metadata and automatic testing notes
        shell: bash
        env:
          RELEASE_NAME: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" app-debug.apk
          sha256sum app-debug.apk > SHA256SUMS.txt

          {
            echo "# Vendora build notes"
            echo
            echo "- **Purpose:** ${RELEASE_NAME%%$'\n'*}"
            echo "- **Branch:** ${GITHUB_REF_NAME}"
            echo "- **Commit:** ${GITHUB_SHA}"
            echo "- **Build date (UTC):** $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- **CI validation:** debug APK build, JVM unit tests, and Android Lint passed."
            echo "- **APK:** app-debug.apk (debug/preview build; not production-signed)"
            echo
            echo "## Changes in this commit"
            git log -1 --pretty=format:'- %s%n' "$GITHUB_SHA"
            echo
            echo "## Files changed in this commit"
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | sed 's/^/- /' || true
            echo
            echo "## Phone testing checklist"
            echo "- Install the APK on a test device; do not use preview builds as the only record for real business data."
            echo "- Verify the feature named in the commit and check shop switching, product persistence, and sales/stock updates where applicable."
            echo "- CI success confirms build, JVM tests, and lint only; it does not replace physical-device testing."
          } > RELEASE-NOTES.md

          {
            echo "Product: Vendora"
            echo "Version name: 0.1.0"
            echo "Version code: 1"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Build type: debug (unsigned preview)"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Minimum Android SDK: 26 (Android 8.0)"
            echo "Target Android SDK: 36"
            echo "Java: 17"
            echo "Validation: assembleDebug, testDebugUnitTest, lintDebug passed"
            echo "APK filename: app-debug.apk"
          } > BUILD-INFO.txt

      - name: Upload APK and notes as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendora-build-${{ github.sha }}
          path: |
            app-debug.apk
            SHA256SUMS.txt
            BUILD-INFO.txt
            RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish-preview:
    name: Publish requested preview
    needs: verify
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) ||
      (github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[phone-test]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: vendora-build-${{ github.sha }}
          path: artifacts

      - name: Publish debug preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && format('v0.1.0-beta-{0}', github.run_number) || format('v0.1.0-preview-{0}', github.run_number) }}
          name: ${{ github.ref == 'refs/heads/main' && format('Vendora Beta 0.1.0 — Build {0}', github.run_number) || format('Vendora Phone Test — {0} #{1}', github.ref_name, github.run_number) }}
          body_path: artifacts/RELEASE-NOTES.md
          files: |
            artifacts/app-debug.apk
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt
            artifacts/RELEASE-NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          generate_release_notes: true
