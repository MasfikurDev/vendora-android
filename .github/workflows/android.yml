name: Android CI and Release Builds

on:
  push:
    branches:
      - '**'
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'build.gradle*'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'build.gradle*'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this successful build as a GitHub prerelease'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tests, and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build and run unit tests
        run: ./gradlew --no-daemon :app:checkDebugAarMetadata assembleDebug testDebugUnitTest compileDebugAndroidTestKotlin

      - name: Prepare build metadata and automatic testing notes
        shell: bash
        env:
          RELEASE_NAME: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          sha256sum "$APK" | sed 's#app/build/outputs/apk/debug/##' > SHA256SUMS.txt

          {
            echo "# Vendora build notes"
            echo
            echo "- **Purpose:** ${RELEASE_NAME%%$'\n'*}"
            echo "- **Branch:** ${GITHUB_REF_NAME}"
            echo "- **Commit:** ${GITHUB_SHA}"
            echo "- **Build date (UTC):** $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- **CI validation:** dependency metadata, debug APK build, JVM unit tests, and Android instrumentation-test source compilation passed."
            echo "- **APK:** app-debug.apk (debug/preview build; not production-signed)"
            echo
            echo "## Changes in this commit"
            git log -1 --pretty=format:'- %s%n' "$GITHUB_SHA"
            echo
            echo "## Files changed in this commit"
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | sed 's/^/- /' || true
            echo
            echo "## Phone testing checklist"
            echo "- Install the APK on a test device; do not use preview builds as the only record for real business data."
            echo "- Verify the feature named in the commit and check for regressions in shop switching, product persistence, and sales/stock updates where applicable."
            echo "- CI compiles instrumentation test sources but does not execute them; this workflow has no emulator job. Device/emulator testing is still required."
          } > RELEASE-NOTES.md

          {
            echo "Product: Vendora"
            echo "Version name: 0.1.0"
            echo "Version code: 1"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Build type: debug (unsigned preview)"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Minimum Android SDK: 26 (Android 8.0)"
            echo "Target Android SDK: 36"
            echo "Java: 17"
            echo "Validation: checkDebugAarMetadata, assembleDebug, testDebugUnitTest, compileDebugAndroidTestKotlin passed"
            echo "APK filename: app-debug.apk"
          } > BUILD-INFO.txt

      - name: Upload APK and notes as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendora-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            SHA256SUMS.txt
            BUILD-INFO.txt
            RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14

      # Publish only when explicitly requested, or when a feature commit is marked [phone-test].
      # Ordinary feature commits still receive CI + a downloadable workflow artifact, not a Release.
      - name: Publish requested feature preview
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref != 'refs/heads/main' || github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[phone-test]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview-${{ github.run_number }}
          name: Vendora Phone Test — ${{ github.ref_name }} #${{ github.run_number }}
          body_path: RELEASE-NOTES.md
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
            BUILD-INFO.txt
            RELEASE-NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          generate_release_notes: true

      # Main beta Releases are not created on every push. Use workflow_dispatch with
      # publish_release=true on main when the merged feature is ready for a beta build.
      - name: Publish requested main beta
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta-${{ github.run_number }}
          name: Vendora Beta 0.1.0 — Build ${{ github.run_number }}
          body_path: RELEASE-NOTES.md
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
            BUILD-INFO.txt
            RELEASE-NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          generate_release_notes: true
