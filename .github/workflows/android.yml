name: Android CI and Automatic Beta Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create a new beta release for this successful main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.${{ github.run_number }}
          name: Vendora Beta 0.1.0 — Build ${{ github.run_number }}
          body: |
            Vendora is an offline-first Android shop management app for small retail businesses.

            This is an automatically generated beta preview from commit ${{ github.sha }}. It is not production-ready; functionality may be incomplete or change between builds.

            ## Current limitations
            - Core shop selection and local shop data are under active development.
            - Full inventory, sales, returns, reporting, and data export workflows may be incomplete.
            - Bugs, data-loss risks, and breaking changes may occur. Do not use this preview as the sole record for a real business.
            - The attached app-debug.apk is a debug build, not a signed production release.

            ## Build details
            - Commit: ${{ github.sha }}
            - Workflow run: ${{ github.run_number }}

            ## Installation
            Download app-debug.apk from the assets below and install it on a compatible Android device. Android may ask you to allow installation from your browser or file manager.
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          generate_release_notes: true
