name: Android CI and Release Builds

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'build.gradle*'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'build.gradle*'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this successful build as a GitHub prerelease'
        required: true
        type: boolean
        default: false
      run_instrumentation:
        description: 'Run slower emulator-backed instrumentation tests'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tests, and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare persistent debug signing key
        # Same-repository PRs can use repo secrets; fork PRs must never receive them.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DEBUG_KEYSTORE_BASE64 DEBUG_KEYSTORE_PASSWORD DEBUG_KEY_ALIAS DEBUG_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions secret ${name} is missing or empty."
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/vendora-debug.jks"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          {
            echo "DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "DEBUG_KEYSTORE_PASSWORD=$DEBUG_KEYSTORE_PASSWORD"
            echo "DEBUG_KEY_ALIAS=$DEBUG_KEY_ALIAS"
            echo "DEBUG_KEY_PASSWORD=$DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build and run unit tests
        run: ./gradlew --no-daemon :app:checkDebugAarMetadata assembleDebug testDebugUnitTest

      - name: Run database and critical-flow instrumentation tests (opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.run_instrumentation == true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Verify APK signature and persistent certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APK_SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          "$APK_SIGNER" verify --verbose "$APK"

          APK_CERT_SHA256=$("$APK_SIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [[ -z "$APK_CERT_SHA256" ]]; then
            echo "::error::Could not read APK signing certificate fingerprint."
            exit 1
          fi
          echo "APK signing certificate SHA-256: $APK_CERT_SHA256"
          echo "APK_CERT_SHA256=$APK_CERT_SHA256" >> "$GITHUB_ENV"

          if [[ -n "${DEBUG_KEYSTORE_PATH:-}" ]]; then
            KEY_CERT_SHA256=$(keytool -exportcert -keystore "$DEBUG_KEYSTORE_PATH" -alias "$DEBUG_KEY_ALIAS" -storepass "$DEBUG_KEYSTORE_PASSWORD" -keypass "$DEBUG_KEY_PASSWORD" | sha256sum | awk '{print $1}')
            if [[ "$APK_CERT_SHA256" != "$KEY_CERT_SHA256" ]]; then
              echo "::error::APK certificate does not match the configured persistent Vendora debug key."
              exit 1
            fi
            echo "Persistent debug certificate fingerprint matches."
          else
            echo "::warning::Fork PR build uses temporary signing; it cannot update persistent-key installs."
          fi

      - name: Prepare build metadata and automatic testing notes
        shell: bash
        env:
          RELEASE_NAME: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" app-debug.apk
          sha256sum app-debug.apk > SHA256SUMS.txt

          if [[ -n "${DEBUG_KEYSTORE_PATH:-}" ]]; then
            SIGNING_NOTE="Persistent Vendora debug signing enabled; feature-branch and main builds using this key can update this installation."
            BUILD_TYPE="debug (persistent Vendora debug key)"
          else
            SIGNING_NOTE="Temporary runner debug signing; this APK cannot update an installation signed with the persistent Vendora debug key."
            BUILD_TYPE="debug (temporary PR signing; fork-safe)"
          fi

          {
            echo "# Vendora build notes"
            echo
            echo "- **Purpose:** ${RELEASE_NAME%%$'\n'*}"
            echo "- **Branch:** ${GITHUB_REF_NAME}"
            echo "- **Commit:** ${GITHUB_SHA}"
            echo "- **Build date (UTC):** $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- **CI validation:** dependency metadata, debug APK build, JVM unit tests, APK signature verification, and persistent-certificate comparison passed where applicable. Emulator instrumentation tests run only when explicitly enabled."
            echo "- **APK:** app-debug.apk; $SIGNING_NOTE"
            echo "- **APK signing certificate SHA-256:** ${APK_CERT_SHA256:-unavailable}"
            echo "- **Version code:** ${GITHUB_RUN_NUMBER}"
            echo
            echo "## Changes in this commit"
            git log -1 --pretty=format:'- %s%n' "$GITHUB_SHA"
            echo
            echo "## Files changed in this commit"
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | sed 's/^/- /' || true
            echo
            echo "## Phone testing checklist"
            echo "- Install the APK on a test device; do not use preview builds as the only record for real business data."
            echo "- Verify the feature named in the commit and check for regressions in shop switching, product persistence, and sales/stock updates where applicable."
            echo "- CI success confirms build and unit tests only; it does not replace physical-device testing."
          } > RELEASE-NOTES.md

          {
            echo "Product: Vendora"
            echo "Version name: 0.1.0"
            echo "Version code: ${GITHUB_RUN_NUMBER}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Build type: $BUILD_TYPE"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Minimum Android SDK: 26 (Android 8.0)"
            echo "Target Android SDK: 36"
            echo "Java: 17"
            echo "Validation: checkDebugAarMetadata, assembleDebug, testDebugUnitTest, apksigner verify, and persistent-certificate comparison; connectedDebugAndroidTest is opt-in"
            echo "APK signing certificate SHA-256: ${APK_CERT_SHA256:-unavailable}"
            echo "APK filename: app-debug.apk"
          } > BUILD-INFO.txt

      - name: Upload APK and notes as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendora-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app-debug.apk
            SHA256SUMS.txt
            BUILD-INFO.txt
            RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/vendora-debug.jks"

  publish-feature-preview:
    name: Publish feature preview
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: vendora-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts

      - name: Publish feature preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview-${{ github.run_number }}
          name: Vendora Phone Test — ${{ github.ref_name }} #${{ github.run_number }}
          body_path: artifacts/RELEASE-NOTES.md
          files: |
            artifacts/app-debug.apk
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt
            artifacts/RELEASE-NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          generate_release_notes: true

  publish-main-beta:
    name: Publish main beta
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: vendora-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts

      - name: Publish main beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta-${{ github.run_number }}
          name: Vendora Beta 0.1.0 — Build ${{ github.run_number }}
          body_path: artifacts/RELEASE-NOTES.md
          files: |
            artifacts/app-debug.apk
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt
            artifacts/RELEASE-NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          generate_release_notes: true
