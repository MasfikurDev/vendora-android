name: Android CI and Release Builds

on:
  push:
    branches:
      - '**'
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'build.gradle*'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'build.gradle*'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this successful signed debug build as a GitHub prerelease'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-sign:
    name: Build, test, sign, and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode signing keystore without logging secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Missing GitHub Actions secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vendora-release.jks"
          test -s "$RUNNER_TEMP/vendora-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/vendora-release.jks" >> "$GITHUB_ENV"

      - name: Build signed debug APK, run unit tests, and lint
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret $name"
              exit 1
            fi
          done
          ./gradlew --no-daemon --build-cache :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Verify debug APK signature and prepare release notes
        shell: bash
        env:
          RELEASE_NAME: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app-debug.apk
          sha256sum app-debug.apk > SHA256SUMS.txt

          {
            echo "# Vendora updatable debug prerelease notes"
            echo
            echo "- **Purpose:** ${RELEASE_NAME%%$'\n'*}"
            echo "- **Branch:** ${GITHUB_REF_NAME}"
            echo "- **Commit:** ${GITHUB_SHA}"
            echo "- **Build date (UTC):** $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- **CI validation:** signed debug APK build, JVM unit tests, Android Lint, and APK signature verification passed."
            echo "- **APK:** app-debug.apk (debug build signed with the persistent Vendora test key; not a production release)"
            echo
            echo "## Phone testing checklist"
            echo "- Install on a test phone and verify launch, shop switching, product persistence, and sales/stock updates."
            echo "- Back up business data before testing."
            echo "- CI success does not replace physical-device testing."
          } > RELEASE-NOTES.md

          {
            echo "Product: Vendora"
            echo "Version name: 0.1.0"
            echo "Version code: 1"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Build type: debug (signed with persistent Vendora test key)"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Minimum Android SDK: 26 (Android 8.0)"
            echo "Target Android SDK: 36"
            echo "Java: 17"
            echo "Validation: assembleDebug, testDebugUnitTest, lintDebug, apksigner verify passed"
            echo "APK filename: app-debug.apk"
          } > BUILD-INFO.txt

      - name: Upload signed APK and notes as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendora-updatable-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app-debug.apk
            SHA256SUMS.txt
            BUILD-INFO.txt
            RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish requested feature preview
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref != 'refs/heads/main') || (github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[phone-test]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview-${{ github.run_number }}
          name: Vendora Updatable Debug Phone Test — ${{ github.ref_name }} #${{ github.run_number }}
          body_path: RELEASE-NOTES.md
          files: |
            app-debug.apk
            SHA256SUMS.txt
            BUILD-INFO.txt
            RELEASE-NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          generate_release_notes: true

      - name: Publish requested main beta
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta-${{ github.run_number }}
          name: Vendora Debug Beta 0.1.0 — Build ${{ github.run_number }}
          body_path: RELEASE-NOTES.md
          files: |
            app-debug.apk
            SHA256SUMS.txt
            BUILD-INFO.txt
            RELEASE-NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          generate_release_notes: true
