name: Generate Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-gradle-wrapper
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and commit Gradle 8.13 wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: feat/android-bootstrap
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate wrapper
        run: |
          gradle --no-daemon wrapper --gradle-version 8.13 --distribution-type bin
          gradle --no-daemon wrapper
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          grep -F 'gradle-8.13-bin.zip' gradle/wrapper/gradle-wrapper.properties

      - name: Commit wrapper files to bootstrap branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle wrapper files are already up to date."
            exit 0
          fi
          git commit -m "build: add Gradle 8.13 wrapper"
          git push origin HEAD:feat/android-bootstrap
