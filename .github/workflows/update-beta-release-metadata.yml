name: Update beta release metadata

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to update
        required: true
        default: beta

permissions:
  contents: write

jobs:
  update-release:
    name: Update release title and notes
    runs-on: ubuntu-latest
    steps:
      - name: Update GitHub release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT

          cat > "$notes_file" <<'NOTES'
          Vendora is an offline-first Android shop management app for small retail businesses.

          This beta is an early preview. It is not production-ready, and functionality may be incomplete or change between builds.

          ## Current limitations

          - Core shop selection and local shop data are under active development.
          - Full inventory, sales, returns, reporting, and data export workflows are not yet complete.
          - Bugs, data-loss risks, and breaking changes may occur; do not use this preview as the sole record for a real business.
          - The attached `app-debug.apk` is a debug build, not a signed production release.

          ## Installation

          Download the APK attached to this release and install it on a compatible Android device. Android may ask you to allow installation from your browser or file manager.

          ## Feedback

          Please report reproducible bugs with your Android version and the steps that led to the issue.
          NOTES

          gh release edit "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --title "Vendora Beta 0.1.0 — Shop Management Preview" \
            --notes-file "$notes_file"

          echo "Updated release metadata for tag: $RELEASE_TAG"
