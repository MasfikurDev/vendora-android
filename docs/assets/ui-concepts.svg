<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">Vendora mobile UI concepts</title>
  <desc id="desc">Three conceptual mobile screens: shop selection, shop dashboard, and inventory. These are design directions, not screenshots of implemented screens.</desc>
  <defs>
    <style>
      .bg{fill:#f3f6f3}.ink{fill:#17231f}.muted{fill:#68766f}.green{fill:#236b55}.light{fill:#e1f1e9}.white{fill:#fff}.line{stroke:#dce5de;stroke-width:1.5}
      .heading{font:700 23px Arial,sans-serif;fill:#17231f}.sub{font:14px Arial,sans-serif;fill:#68766f}.label{font:700 11px Arial,sans-serif;letter-spacing:1.2px;fill:#68766f}.body{font:14px Arial,sans-serif;fill:#17231f}.small{font:12px Arial,sans-serif;fill:#68766f}.tiny{font:10px Arial,sans-serif;fill:#68766f}.whiteText{font:700 12px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1440" height="940" rx="24" fill="#f7f9f7"/>
  <text x="64" y="68" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#236b55">VENDORA / PRODUCT DESIGN</text>
  <text x="64" y="116" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17231f">A calmer way to run a shop</text>
  <text x="64" y="148" font-family="Arial,sans-serif" font-size="17" fill="#68766f">Mobile-first concepts for the core daily workflow</text>
  <rect x="64" y="174" width="1312" height="42" rx="12" fill="#fff3d8"/>
  <text x="84" y="200" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#775318">CONCEPT ONLY</text>
  <text x="190" y="200" font-family="Arial,sans-serif" font-size="13" fill="#775318">These are design references, not screenshots or claims about completed features.</text>

  <!-- Phone 1 -->
  <g transform="translate(104 250)">
    <rect width="350" height="590" rx="34" fill="#17231f"/>
    <rect x="9" y="9" width="332" height="572" rx="27" fill="#f5f7f5"/>
    <rect x="125" y="14" width="100" height="14" rx="7" fill="#17231f"/>
    <text x="28" y="58" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#236b55">VENDORA</text>
    <text x="28" y="96" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17231f">Your businesses</text>
    <text x="28" y="120" class="sub">All your shops, one place.</text>
    <text x="28" y="159" class="label">YOUR SHOPS</text>
    <text x="294" y="159" class="small">2 shops</text>
    <rect x="22" y="177" width="306" height="82" rx="18" fill="#e1f1e9" stroke="#8db8a5"/>
    <rect x="36" y="193" width="48" height="48" rx="14" fill="#236b55"/>
    <text x="53" y="224" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">R</text>
    <text x="98" y="208" class="body" font-weight="700">Rahman Store</text>
    <text x="98" y="229" class="small">General store</text>
    <rect x="251" y="199" width="63" height="22" rx="11" fill="#236b55"/>
    <text x="263" y="214" class="whiteText" font-size="9">ACTIVE</text>
    <rect x="22" y="271" width="306" height="82" rx="18" fill="#fff" stroke="#dce5de"/>
    <rect x="36" y="287" width="48" height="48" rx="14" fill="#edf1ee"/>
    <text x="53" y="318" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#236b55">M</text>
    <text x="98" y="302" class="body" font-weight="700">Market Corner</text>
    <text x="98" y="323" class="small">Grocery</text>
    <text x="301" y="318" font-family="Arial,sans-serif" font-size="27" fill="#68766f">›</text>
    <rect x="22" y="369" width="306" height="52" rx="15" fill="#fff" stroke="#236b55" stroke-width="1.5"/>
    <text x="97" y="400" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#236b55">+ Add another shop</text>
    <text x="28" y="457" class="small">Your active shop is saved on this device.</text>
    <rect x="9" y="526" width="332" height="55" rx="0" fill="#fff"/>
    <text x="28" y="552" class="tiny">SHOPS</text><text x="116" y="552" class="tiny">PRODUCTS</text><text x="222" y="552" class="tiny">SETTINGS</text>
    <text x="28" y="573" class="tiny" fill="#236b55">●</text><text x="116" y="573" class="tiny">○</text><text x="222" y="573" class="tiny">○</text>
    <text x="0" y="628" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17231f">01 — Shop selection</text>
    <text x="0" y="652" class="sub">Switch context before managing data.</text>
  </g>

  <!-- Phone 2 -->
  <g transform="translate(545 250)">
    <rect width="350" height="590" rx="34" fill="#17231f"/>
    <rect x="9" y="9" width="332" height="572" rx="27" fill="#f5f7f5"/>
    <rect x="125" y="14" width="100" height="14" rx="7" fill="#17231f"/>
    <text x="28" y="57" class="small">‹ All shops</text>
    <text x="28" y="91" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17231f">Rahman Store</text>
    <text x="28" y="115" class="sub">General store · Offline mode</text>
    <rect x="22" y="136" width="306" height="100" rx="20" fill="#236b55"/>
    <text x="40" y="164" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#d8eee3">TODAY'S SALES</text>
    <text x="40" y="204" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#fff">৳ 8,450</text>
    <text x="250" y="205" font-family="Arial,sans-serif" font-size="12" fill="#e1f1e9">View →</text>
    <text x="22" y="273" class="label">QUICK ACTIONS</text>
    <rect x="22" y="290" width="145" height="78" rx="16" fill="#fff" stroke="#dce5de"/>
    <rect x="38" y="306" width="30" height="30" rx="9" fill="#e1f1e9"/>
    <text x="47" y="327" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#236b55">+</text>
    <text x="38" y="354" class="body" font-weight="700">Add product</text>
    <rect x="183" y="290" width="145" height="78" rx="16" fill="#fff" stroke="#dce5de"/>
    <rect x="199" y="306" width="30" height="30" rx="9" fill="#e1f1e9"/>
    <text x="207" y="327" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#236b55">৳</text>
    <text x="199" y="354" class="body" font-weight="700">Record sale</text>
    <text x="22" y="405" class="label">SHOP HEALTH</text>
    <rect x="22" y="422" width="306" height="69" rx="16" fill="#fff" stroke="#dce5de"/>
    <circle cx="47" cy="447" r="7" fill="#e4a23b"/>
    <text x="64" y="450" class="body" font-weight="700">Low-stock items</text>
    <text x="64" y="472" class="small">Review items that need restocking</text>
    <text x="300" y="459" class="body" font-weight="700">4</text>
    <rect x="9" y="526" width="332" height="55" fill="#fff"/>
    <text x="28" y="552" class="tiny">HOME</text><text x="102" y="552" class="tiny">PRODUCTS</text><text x="196" y="552" class="tiny">SALES</text><text x="272" y="552" class="tiny">MORE</text>
    <text x="0" y="628" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17231f">02 — Shop dashboard</text>
    <text x="0" y="652" class="sub">Prioritize daily actions and key signals.</text>
  </g>

  <!-- Phone 3 -->
  <g transform="translate(986 250)">
    <rect width="350" height="590" rx="34" fill="#17231f"/>
    <rect x="9" y="9" width="332" height="572" rx="27" fill="#f5f7f5"/>
    <rect x="125" y="14" width="100" height="14" rx="7" fill="#17231f"/>
    <text x="28" y="57" class="small">‹ Dashboard</text>
    <text x="28" y="91" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17231f">Products</text>
    <text x="28" y="115" class="sub">Rahman Store</text>
    <rect x="22" y="136" width="306" height="46" rx="14" fill="#fff" stroke="#dce5de"/>
    <circle cx="42" cy="157" r="7" fill="none" stroke="#68766f" stroke-width="1.5"/>
    <line x1="47" y1="162" x2="52" y2="167" stroke="#68766f" stroke-width="1.5"/>
    <text x="62" y="162" class="small">Search name or barcode</text>
    <rect x="22" y="195" width="306" height="42" rx="12" fill="#e1f1e9"/>
    <text x="37" y="221" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#236b55">All items</text>
    <text x="126" y="221" class="small">Low stock</text>
    <text x="232" y="221" class="small">Categories</text>
    <g>
      <rect x="22" y="250" width="306" height="70" rx="15" fill="#fff" stroke="#dce5de"/>
      <rect x="34" y="263" width="43" height="43" rx="11" fill="#f0f3f1"/>
      <rect x="48" y="271" width="16" height="25" rx="4" fill="#8db8a5"/>
      <text x="90" y="273" class="body" font-weight="700">Cooking oil 1L</text>
      <text x="90" y="293" class="small">SKU: OIL-001</text>
      <text x="90" y="310" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#236b55">৳ 185.00</text>
      <text x="283" y="293" class="small">Stock</text><text x="294" y="310" class="body" font-weight="700">12</text>
      <rect x="22" y="330" width="306" height="70" rx="15" fill="#fff" stroke="#dce5de"/>
      <rect x="34" y="343" width="43" height="43" rx="11" fill="#f0f3f1"/>
      <rect x="43" y="355" width="25" height="20" rx="4" fill="#b9c7be"/>
      <text x="90" y="353" class="body" font-weight="700">Rice 5kg</text>
      <text x="90" y="373" class="small">SKU: RICE-005</text>
      <text x="90" y="390" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#236b55">৳ 420.00</text>
      <text x="273" y="373" class="small">Stock</text><text x="294" y="390" class="body" font-weight="700">3</text>
      <rect x="22" y="410" width="306" height="70" rx="15" fill="#fff" stroke="#dce5de"/>
      <rect x="34" y="423" width="43" height="43" rx="11" fill="#f0f3f1"/>
      <rect x="43" y="432" width="25" height="25" rx="5" fill="#d7bd8a"/>
      <text x="90" y="433" class="body" font-weight="700">Tea 200g</text>
      <text x="90" y="453" class="small">SKU: TEA-200</text>
      <text x="90" y="470" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#236b55">৳ 110.00</text>
      <text x="273" y="453" class="small">Stock</text><text x="294" y="470" class="body" font-weight="700">8</text>
    </g>
    <rect x="9" y="526" width="332" height="55" fill="#fff"/>
    <text x="28" y="552" class="tiny">HOME</text><text x="102" y="552" class="tiny">PRODUCTS</text><text x="196" y="552" class="tiny">SALES</text><text x="272" y="552" class="tiny">MORE</text>
    <text x="0" y="628" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17231f">03 — Product list</text>
    <text x="0" y="652" class="sub">Searchable, scannable, stock-aware.</text>
  </g>
  <text x="64" y="912" font-family="Arial,sans-serif" font-size="12" fill="#68766f">Design principles: mobile-first · offline-first · clear shop context · accessible contrast · minimal daily steps</text>
</svg>