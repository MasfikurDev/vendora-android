<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
<title id="title">Vendora five-destination product direction</title>
<desc id="desc">Five mobile screen concepts showing business dashboard, image-first products, fast multi-item point of sale, insights charts, and a social-account-style business profile. Illustrative mockups, not screenshots of implemented UI.</desc>
